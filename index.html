<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loot Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #161c18;
            --text-color: #ffffff;
            --accent-green: #2ecc71;
            --green-glow: rgba(46, 204, 113, 0.35);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 40px;
        }
        h1 { 
            text-align: center; 
            font-size: 24px; 
            margin-bottom: 24px; 
            color: var(--accent-green); 
            text-shadow: 0 0 15px var(--green-glow);
        }
        h2 { 
            font-size: 16px; 
            margin-top: 32px; 
            border-bottom: 1px solid #1f2e22; 
            padding-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7ab890;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        
        /* Премиальная карточка «Базовый узел» в зеленом стиле */
        .case-card-special {
            background: linear-gradient(145deg, #19241c, #101612);
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 20px var(--green-glow), inset 0 0 15px rgba(46, 204, 113, 0.1);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s;
        }
        .case-card-special:active { 
            transform: scale(0.95); 
        }

        /* Брендированная плашка LOOTGIFT */
        .brand-badge {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #0b1a10;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.4);
        }

        /* Секция отрисовки кастомного кейса с помощью SVG и иконок */
        .case-graphic-box {
            position: relative;
            height: 90px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        /* Торчащие предметы из кейса */
        .floating-item-left {
            position: absolute;
            top: 2px;
            left: 22%;
            font-size: 24px;
            z-index: 1;
            filter: drop-shadow(0 0 6px rgba(46, 204, 113, 0.6));
            animation: floatSlow 3s ease-in-out infinite;
        }
        .floating-item-right {
            position: absolute;
            top: 6px;
            right: 22%;
            font-size: 24px;
            z-index: 1;
            filter: drop-shadow(0 0 6px rgba(46, 204, 113, 0.6));
            animation: floatSlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }

        /* Сам тактический черный ящик (векторная стилизация) */
        .tactical-case {
            width: 75px;
            height: 48px;
            background: #0d120f;
            border: 2px solid #233829;
            border-radius: 8px;
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.05);
        }
        /* Ручка кейса */
        .tactical-case::before {
            content: '';
            position: absolute;
            top: -8px;
            width: 24px;
            height: 8px;
            border: 2px solid #324d3a;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            background: #141f17;
        }
        /* Замки на кейсе */
        .case-latches {
            position: absolute;
            bottom: 6px;
            width: 50px;
            display: flex;
            justify-content: space-between;
        }
        .latch {
            width: 8px;
            height: 5px;
            background: #2ecc71;
            border-radius: 2px;
            box-shadow: 0 0 5px #2ecc71;
        }

        .case-name { 
            font-size: 14px; 
            font-weight: 700; 
            margin-bottom: 4px; 
        }
        .case-price { 
            font-size: 12px; 
            color: #7ab890; 
            margin-bottom: 12px; 
        }

        /* Стандартные карточки */
        .case-card {
            background-color: var(--card-bg);
            border: 1px solid #1f2e22;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            transition: transform 0.1s;
        }
        .case-card:active { 
            transform: scale(0.95); 
        }
        .case-icon { 
            font-size: 36px; 
            margin-bottom: 8px; 
        }
        .case-name-std { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 4px; 
        }
        .case-price-std { 
            font-size: 12px; 
            color: #7ab890; 
            margin-bottom: 12px; 
        }
        
        .btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #0b1a10;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <h1>✨ LooTGift</h1>
    <div id="app"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const categories = [
            {
                title: "Обычные модули",
                cases: [
                    { 
                        name: "Базовый узел", 
                        price: 25, 
                        special: true, 
                        items: ["🦅", "🧸"] 
                    },
                    { name: "Сектор 7", price: 50, icon: "📦" },
                    { name: "Медный реле", price: 50, icon: "⚙️" },
                    { name: "Системный блок", price: 100, icon: "🖥" },
                    { name: "Оранжевый поток", price: 250, icon: "🔥" },
                    { name: "Тяжелый архив", price: 500, icon: "🗄" },
                    { name: "Ядро Титана", price: 1000, icon: "☄️" },
                    { name: "Зенит", price: 2500, icon: "🌌" }
                ]
            },
            {
                title: "Фарм-кейсы",
                cases: [
                    { name: "Груда лома", price: 1, icon: "🔩" },
                    { name: "Техно-свалка", price: 5, icon: "🗑" },
                    { name: "Реакторный отсек", price: 10, icon: "☢️" }
                ]
            },
            {
                title: "Риск 50/50",
                cases: [
                    { name: "Бинарный код", price: 50, icon: "⚖️" },
                    { name: "Критический вольт", price: 200, icon: "⚡" },
                    { name: "Перегрузка", price: 500, icon: "💥" },
                    { name: "Сингулярность", price: 1000, icon: "🕳" }
                ]
            }
        ];

        const appDiv = document.getElementById('app');

        categories.forEach(category => {
            const title = document.createElement('h2');
            title.innerText = category.title;
            appDiv.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'grid-container';

            category.cases.forEach(c => {
                const card = document.createElement('div');
                
                if (c.special) {
                    card.className = 'case-card-special';
                    card.innerHTML = `
                        <div class="brand-badge">LooTGift</div>
                        <div class="case-graphic-box">
                            <div class="floating-item-left">${c.items[0]}</div>
                            <div class="floating-item-right">${c.items[1]}</div>
                            <div class="tactical-case">
                                <div class="case-latches">
                                    <div class="latch"></div>
                                    <div class="latch"></div>
                                </div>
                            </div>
                        </div>
                        <div class="case-name">${c.name}</div>
                        <div class="case-price">${c.price} Stars</div>
                        <button class="btn" onclick="openCase('${c.name}')">Открыть</button>
                    `;
                } else {
                    card.className = 'case-card';
                    card.innerHTML = `
                        <div class="case-icon">${c.icon}</div>
                        <div class="case-name-std">${c.name}</div>
                        <div class="case-price-std">${c.price} Stars</div>
                        <button class="btn" onclick="openCase('${c.name}')">Купить</button>
                    `;
                }
                grid.appendChild(card);
            });

            appDiv.appendChild(grid);
        });

        function openCase(name) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showAlert('Вы открываете кейс: ' + name);
        }
    </script>
</body>
</html>
