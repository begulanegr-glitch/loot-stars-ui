<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LootGift</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #161c18;
            --text-color: #ffffff;
            --accent-green: #71e654;
            --green-glow: rgba(113, 230, 84, 0.35);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 40px;
        }
        
        /* Стили для твоего нового логотипа в шапке */
        .header-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .header-logo img {
            max-width: 200px;
            height: auto;
            filter: drop-shadow(0 0 15px var(--green-glow));
        }

        h2 { 
            font-size: 16px; 
            margin-top: 32px; 
            border-bottom: 1px solid #1f2e22; 
            padding-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7ab890;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        
        /* Стили для твоей картинки премиум-кейса */
        .case-card-special {
            background: linear-gradient(145deg, #1f192b, #120e1a);
            border: 2px solid #5a3e8c;
            box-shadow: 0 0 20px rgba(90, 62, 140, 0.4);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            transition: transform 0.1s;
        }
        .case-card-special:active { 
            transform: scale(0.95); 
        }
        .premium-case-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .case-name { 
            font-size: 16px; 
            font-weight: 800; 
            margin-bottom: 4px; 
            color: #d4bfff;
        }
        .case-price { 
            font-size: 14px; 
            color: var(--accent-green); 
            font-weight: bold;
            margin-bottom: 12px; 
        }

        /* Стандартные карточки */
        .case-card {
            background-color: var(--card-bg);
            border: 1px solid #1f2e22;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            transition: transform 0.1s;
        }
        .case-card:active { transform: scale(0.95); }
        .case-icon { font-size: 36px; margin-bottom: 8px; }
        .case-name-std { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .case-price-std { font-size: 12px; color: #7ab890; margin-bottom: 12px; }
        
        .btn {
            background: linear-gradient(135deg, #71e654, #4db335);
            color: #0b1a10;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(113, 230, 84, 0.3);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .btn-premium {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 4px 12px rgba(155, 89, 182, 0.4);
        }
    </style>
</head>
<body>

    <div class="header-logo">
        <img src="logo-text.jpg.jfif" alt="LootGift Logo">
    </div>
    
    <div id="app"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const categories = [
            {
                title: "Эксклюзивные кейсы",
                cases: [
                    { 
                        name: "Эпический Дар", 
                        price: 250, 
                        special: true 
                    }
                ]
            },
            {
                title: "Обычные модули",
                cases: [
                    { name: "Сектор 7", price: 50, icon: "📦" },
                    { name: "Медный реле", price: 50, icon: "⚙️" },
                    { name: "Системный блок", price: 100, icon: "🖥" }
                ]
            }
        ];

        const appDiv = document.getElementById('app');

        categories.forEach(category => {
            const title = document.createElement('h2');
            title.innerText = category.title;
            appDiv.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'grid-container';

            category.cases.forEach(c => {
                const card = document.createElement('div');
                
                if (c.special) {
                    card.className = 'case-card-special';
                    card.innerHTML = `
                        <img src="case1.jpg.jfif" class="premium-case-img" alt="Кейс">
                        <div class="case-name">${c.name}</div>
                        <div class="case-price">${c.price} Stars</div>
                        <button class="btn btn-premium" onclick="openCase('${c.name}')">Открыть</button>
                    `;
                } else {
                    card.className = 'case-card';
                    card.innerHTML = `
                        <div class="case-icon">${c.icon}</div>
                        <div class="case-name-std">${c.name}</div>
                        <div class="case-price-std">${c.price} Stars</div>
                        <button class="btn" onclick="openCase('${c.name}')">Купить</button>
                    `;
                }
                grid.appendChild(card);
            });

            appDiv.appendChild(grid);
        });

        function openCase(name) {
            tg.HapticFeedback.impactOccurred('heavy');
            tg.showAlert('Загрузка анимации для: ' + name);
        }
    </script>
</body>
</html>
