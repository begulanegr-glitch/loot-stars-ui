<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LootGift</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #2b2e3e; 
            --card-bg: #1e202d; 
            --text-color: #ffffff;
            --accent-green: #71e654;
            --green-glow: rgba(113, 230, 84, 0.4);
            --border-color: #3e4257;
            
            --row-height: 120px;
            --item-size: 100px;
            --item-font: 50px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; padding-bottom: 40px; overflow-x: hidden; padding-top: 70px; }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ БАЛАНСА --- */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; background-color: #1a1b26; border-bottom: 2px solid var(--border-color);
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .balance-box {
            background: rgba(113, 230, 84, 0.1); border: 1px solid var(--accent-green); padding: 6px 12px;
            border-radius: 8px; color: var(--accent-green); font-weight: 900; font-size: 16px;
            display: flex; align-items: center; gap: 5px; box-shadow: 0 0 10px var(--green-glow);
        }

        /* --- ЭКРАН ЗАГРУЗКИ --- */
        #loading-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050508; transition: opacity 0.6s ease, visibility 0.6s ease; }
        .loading-content { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .loading-content img { max-width: 220px; border-radius: 20px; animation: pulseLogo 2s infinite alternate ease-in-out; mix-blend-mode: lighten; }
        .loading-text { margin-top: 24px; font-size: 18px; font-weight: bold; color: var(--accent-green); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--green-glow); animation: pulseText 1.5s infinite alternate ease-in-out; }
        @keyframes pulseLogo { 0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(113, 230, 84, 0.1)); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(113, 230, 84, 0.5)); } }
        @keyframes pulseText { 0% { opacity: 0.6; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1.05); } }

        /* --- ОСНОВНАЯ ИГРА --- */
        #app-content { transition: opacity 0.5s ease; }
        h2 { font-size: 16px; margin-top: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; color: #d4bfff; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 16px; }
        
        .case-card-special { background-color: var(--bg-color); border: 2px solid #5a3e8c; border-radius: 16px; padding: 0; text-align: center; transition: transform 0.1s; overflow: hidden; box-shadow: 0 0 20px rgba(90, 62, 140, 0.4); display: flex; flex-direction: column; }
        .case-card-special:active { transform: scale(0.95); }
        .premium-case-img { width: 100%; display: block; -webkit-mask-image: linear-gradient(to bottom, black 95%, transparent 100%); mask-image: linear-gradient(to bottom, black 95%, transparent 100%); }
        .case-info-box { background-color: transparent; padding: 0px 14px 16px 14px; position: relative; z-index: 2; margin-top: -5px; }
        .case-name { font-size: 16px; font-weight: 800; margin-bottom: 4px; color: #ffffff; }
        .case-price { font-size: 14px; color: var(--accent-green); font-weight: bold; margin-bottom: 12px; }

        .btn { background: linear-gradient(135deg, #71e654, #4db335); color: #0b1a10; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-premium { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; }

        /* --- ЭКРАН РУЛЕТКИ --- */
        #roulette-screen { display: none; flex-direction: column; align-items: center; padding-top: 20px; opacity: 0; transition: opacity 0.5s ease; }
        .back-btn { align-self: flex-start; background: #3e4257; padding: 8px 16px; border-radius: 8px; color: white; border: none; margin-bottom: 20px; cursor: pointer; font-weight: bold; }
        
        .roulette-wrapper { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .roulette-row { width: 100%; height: var(--row-height); background: #1a1b26; border: 2px solid #5a3e8c; border-radius: 12px; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); transition: height 0.3s ease; }
        .roulette-strip { display: flex; height: 100%; position: absolute; left: 0; top: 0; }
        
        .roulette-item { box-sizing: border-box; width: var(--item-size); height: var(--item-size); margin: 10px; background: var(--bg-color); border-radius: 10px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; border: 1px solid var(--border-color); transition: all 0.3s ease; }
        .roulette-item img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
        
        .center-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #71e654; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 10px #71e654; }

        .spin-btn { background: #71e654; color: #000; font-size: 24px; font-weight: 900; padding: 15px 40px; border-radius: 12px; border: none; box-shadow: 0 6px 0 #4db335; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 350px; margin-bottom: 15px; transition: 0.2s; }
        .spin-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #4db335; }
        .spin-btn:disabled { background: #555; box-shadow: 0 6px 0 #333; color: #888; cursor: not-allowed; transform: translateY(6px); }

        .qty-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .qty-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: white; border-radius: 6px; padding: 10px 16px; font-weight: bold; cursor: pointer; transition: 0.2s; flex: 1; text-align: center; }
        .qty-btn.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
        
        .promo-input { background: var(--card-bg); color: white; width: 100%; max-width: 350px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; text-align: center; box-sizing: border-box; outline: none; transition: 0.2s; }
        .promo-input:focus { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(113, 230, 84, 0.2); }

        .loot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 350px; }
        .loot-box { background: #1a1b26; border: 1px solid #3e4257; border-radius: 8px; height: 75px; display: flex; justify-content: center; align-items: center; position: relative;}
        .loot-box img { width: 70%; height: 70%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        
        .loot-box::after { content: ''; position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 2px;}
        .rarity-trash::after { background: #888; }
        .rarity-common::after { background: #5a3e8c; } 
        .rarity-rare::after { background: #e6a822; } 
        .rarity-legendary::after { background: #ff0044; box-shadow: 0 0 5px #ff0044;} 
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="user-info">
            <span id="tg-username">Игрок</span>
        </div>
        <div class="balance-box">
            ⭐ <span id="balance-display">1000</span>
        </div>
    </div>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen">
        <div class="loading-content">
            <img src="logo-text.jpg.jfif" alt="LootGift Logo">
            <div class="loading-text">Добро пожаловать</div>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="app-content">
        <div id="app"></div>
    </div>

    <!-- ЭКРАН РУЛЕТКИ -->
    <div id="roulette-screen">
        <button class="back-btn" onclick="closeRoulette()">← Назад</button>
        <div class="roulette-wrapper" id="roulette-wrapper"></div>
        <button class="spin-btn" id="spin-btn" onclick="spinRoulette()">Крутить!</button>
        
        <div class="qty-row">
            <button class="qty-btn active" onclick="selectQty(this, 1)">1</button>
            <button class="qty-btn" onclick="selectQty(this, 2)">2</button>
            <button class="qty-btn" onclick="selectQty(this, 3)">3</button>
            <button class="qty-btn" onclick="selectQty(this, 4)">4</button>
            <button class="qty-btn" onclick="selectQty(this, 5)">5</button>
        </div>

        <input type="text" class="promo-input" placeholder="ПРОМОКОД">
        <div class="loot-grid" id="loot-grid"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // СИСТЕМА БАЛАНСА
        let userBalance = 1000;
        
        // Пытаемся получить имя из Телеграма
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('tg-username').innerText = tg.initDataUnsafe.user.first_name;
        }

        function updateBalanceDisplay() {
            document.getElementById('balance-display').innerText = userBalance;
        }

        let currentQty = 1; 
        let currentItemSize = 100;
        let activeCaseId = null;
        let activeCasePrice = 0;

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                document.getElementById('loading-screen').style.visibility = 'hidden';
                document.getElementById('app-content').style.opacity = '1';
                document.body.style.overflow = 'auto'; 
            }, 2500); 
        });

        // БАЗА ДАННЫХ
        const casesData = {
            epicCase: [
                { icon: 'bear.png', name: 'Мишка', value: 15, prob: 0.35, rarity: 'trash' },
                { icon: 'rose.png', name: 'Роза', value: 25, prob: 0.15, rarity: 'trash' },
                { icon: 'stars50.png', name: '25 Звёзд', value: 25, prob: 0.169, rarity: 'trash' },
                { icon: 'cake.png', name: 'Торт', value: 50, prob: 0.08, rarity: 'trash' },
                { icon: 'stars50.png', name: '50 Звёзд', value: 50, prob: 0.10, rarity: 'common' },
                { icon: 'diamond.png', name: 'Алмаз', value: 100, prob: 0.07, rarity: 'common' },
                { icon: 'stars150.png', name: '150 Звёзд', value: 150, prob: 0.04, rarity: 'common' },
                { icon: 'stars300.png', name: '300 Звёзд', value: 300, prob: 0.02, rarity: 'common' },
                { icon: 'tie.png', name: 'Бабочка', value: 600, prob: 0.01, rarity: 'rare' },
                { icon: 'button.png', name: 'Кнопка', value: 700, prob: 0.008, rarity: 'rare' },
                { icon: 'sphere.png', name: 'Сфера', value: 1305, prob: 0.002, rarity: 'legendary' },
                { icon: 'eagle.png', name: 'Орёл', value: 2655, prob: 0.001, rarity: 'legendary' }
            ],
            summerCase: [
                { icon: 'stars1.png', name: '1 Звезда', value: 1, prob: 0.3605, rarity: 'trash' },
                { icon: 'stars2.png', name: '2 Звезды', value: 2, prob: 0.25, rarity: 'trash' },
                { icon: 'stars3.png', name: '3 Звезды', value: 3, prob: 0.15, rarity: 'trash' },
                { icon: 'stars5.png', name: '5 Звёзд', value: 5, prob: 0.10, rarity: 'trash' },
                { icon: 'stars10.png', name: '10 Звёзд', value: 10, prob: 0.05, rarity: 'common' },
                { icon: 'heart.png', name: 'Сердце', value: 15, prob: 0.05, rarity: 'common' },
                { icon: 'rose.png', name: 'Роза', value: 25, prob: 0.02, rarity: 'common' },
                { icon: 'tulips.png', name: 'Тюльпаны', value: 50, prob: 0.01, rarity: 'common' },
                { icon: 'diamond.png', name: 'Алмаз', value: 100, prob: 0.005, rarity: 'rare' },
                { icon: 'flamingo.png', name: 'Фламинго', value: 370, prob: 0.0025, rarity: 'rare' },
                { icon: 'lollipop.png', name: 'Леденец', value: 450, prob: 0.0015, rarity: 'legendary' },
                { icon: 'bouquet.png', name: 'Букет', value: 600, prob: 0.0005, rarity: 'legendary' }
            ]
        };

        let spinsCount = 0; 

        function getRandomItem(caseId) {
            spinsCount++;
            let items = casesData[caseId];
            let rand = Math.random();
            if (spinsCount <= 2 && rand > 0.4) return items[7]; 
            let cumulative = 0;
            for (let i = 0; i < items.length; i++) {
                cumulative += items[i].prob;
                if (rand <= cumulative) return items[i];
            }
            return items[0]; 
        }

        function renderLootGrid(caseId) {
            const grid = document.getElementById('loot-grid');
            grid.innerHTML = '';
            const reversedItems = [...casesData[caseId]].reverse();
            reversedItems.forEach(item => {
                grid.innerHTML += `<div class="loot-box rarity-${item.rarity}"><img src="${item.icon}" alt="${item.name}"></div>`;
            });
        }

        function renderRouletteRows() {
            const wrapper = document.getElementById('roulette-wrapper');
            wrapper.innerHTML = '';
            
            let itemSize = 100;
            if (currentQty === 2) itemSize = 85; 
            if (currentQty === 3) itemSize = 75; 
            if (currentQty === 4) itemSize = 65; 
            if (currentQty === 5) itemSize = 55; 
            
            currentItemSize = itemSize; 
            wrapper.style.setProperty('--item-size', itemSize + 'px');
            wrapper.style.setProperty('--row-height', (itemSize + 20) + 'px');

            for(let i = 0; i < currentQty; i++) {
                wrapper.innerHTML += `
                    <div class="roulette-row">
                        <div class="center-line"></div>
                        <div class="roulette-strip" id="strip-${i}"></div>
                    </div>
                `;
            }
            
            // Обновляем текст на кнопке с учетом стоимости
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.innerText = `КРУТИТЬ ЗА ${activeCasePrice * currentQty} ⭐`;
        }

        function openCaseScreen(caseId, price) {
            activeCaseId = caseId;
            activeCasePrice = price;
            
            document.getElementById('app-content').style.display = 'none';
            const rScreen = document.getElementById('roulette-screen');
            rScreen.style.display = 'flex';
            setTimeout(() => rScreen.style.opacity = '1', 50);
            
            renderRouletteRows();
            renderLootGrid(caseId);
        }

        function closeRoulette() {
            const rScreen = document.getElementById('roulette-screen');
            rScreen.style.opacity = '0';
            setTimeout(() => {
                rScreen.style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                activeCaseId = null;
            }, 500);
        }

        function selectQty(btn, qty) {
            document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentQty = qty;
            renderRouletteRows();
        }

        function spinRoulette() {
            const totalCost = activeCasePrice * currentQty;
            
            // ПРОВЕРКА БАЛАНСА
            if (userBalance < totalCost) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Недостаточно звёзд на балансе!');
                return;
            }

            // Списываем баланс
            userBalance -= totalCost;
            updateBalanceDisplay();

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            tg.HapticFeedback.impactOccurred('medium');

            let drops = [];
            let totalValue = 0;
            const totalItems = 50; 
            const winnerIndex = 40; 
            const wrapper = document.getElementById('roulette-wrapper');
            const itemTotalWidth = currentItemSize + 20;
            const currentItems = casesData[activeCaseId];

            for(let rowIdx = 0; rowIdx < currentQty; rowIdx++) {
                let actualItem = getRandomItem(activeCaseId);
                drops.push(actualItem);
                totalValue += actualItem.value;

                let strip = document.getElementById(`strip-${rowIdx}`);
                strip.style.transition = 'none';
                strip.style.transform = 'translateX(0)';
                strip.innerHTML = '';

                for (let i = 0; i < totalItems; i++) {
                    let div = document.createElement('div');
                    div.className = 'roulette-item';
                    
                    if (i === winnerIndex) {
                        div.innerHTML = `<img src="${actualItem.icon}">`; 
                    } else {
                        let r = Math.random();
                        let visualItem;
                        if (r < 0.10) visualItem = currentItems[0];      
                        else if (r < 0.30) visualItem = currentItems[5]; 
                        else if (r < 0.60) visualItem = currentItems[7]; 
                        else if (r < 0.82) visualItem = currentItems[8]; 
                        else if (r < 0.97) visualItem = currentItems[9]; 
                        else visualItem = currentItems[11];              
                        
                        div.innerHTML = `<img src="${visualItem.icon}">`;
                    }
                    strip.appendChild(div);
                }

                let duration = 5 + (rowIdx * 0.2); 
                setTimeout(() => {
                    strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.85, 0.1, 1)`;
                    const containerWidth = wrapper.offsetWidth;
                    const randomOffset = Math.floor(Math.random() * (currentItemSize * 0.8)) - (currentItemSize * 0.4);
                    const stopPosition = (containerWidth / 2) - (winnerIndex * itemTotalWidth + (itemTotalWidth / 2)) + randomOffset;
                    strip.style.transform = `translateX(${stopPosition}px)`;
                }, 50);
            }

            let maxDelay = 5200 + ((currentQty - 1) * 200);
            setTimeout(() => {
                btn.disabled = false;
                
                // Начисляем выигрыш
                userBalance += totalValue;
                updateBalanceDisplay();

                tg.HapticFeedback.notificationOccurred('success');
                
                if (currentQty === 1) {
                    tg.showAlert(`Выпало: ${drops[0].name}\nВы получили: +${totalValue} ⭐`);
                } else {
                    tg.showAlert(`Вы открыли ${currentQty} кейсов!\nВы получили: +${totalValue} ⭐`);
                }
            }, maxDelay);
        }

        // РЕНДЕР КЕЙСОВ
        const categories = [
            {
                title: "Эксклюзивные кейсы",
                cases: [
                    { id: 'epicCase', name: "Эпический Дар", price: 100, image: "case1.jpg.jfif" },
                    { id: 'summerCase', name: "Летний Вайб", price: 10, image: "case2.png" } // Используем case2.png!
                ]
            }
        ];

        const appDiv = document.getElementById('app');
        categories.forEach(category => {
            const title = document.createElement('h2');
            title.innerText = category.title;
            appDiv.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'grid-container';

            category.cases.forEach(c => {
                const card = document.createElement('div');
                card.className = 'case-card-special';
                card.innerHTML = `
                    <img src="${c.image}" class="premium-case-img" alt="${c.name}">
                    <div class="case-info-box">
                        <div class="case-name">${c.name}</div>
                        <div class="case-price">${c.price} Stars</div>
                        <button class="btn btn-premium" onclick="openCaseScreen('${c.id}', ${c.price})">ОТКРЫТЬ</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            appDiv.appendChild(grid);
        });
    </script>
</body>
</html>
