<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loot Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Жестко скрываем дебильную плашку Netlify */
        netlify-badge, 
        #netlify-badge, 
        .netlify-badge, 
        a[href*="netlify.com"] {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --accent-color: #f39c12;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 40px;
        }
        h1 { 
            text-align: center; 
            font-size: 24px; 
            margin-bottom: 24px; 
            color: var(--accent-color); 
        }
        h2 { 
            font-size: 16px; 
            margin-top: 32px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .case-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: transform 0.1s;
        }
        .case-card:active { 
            transform: scale(0.95); 
        }
        .case-icon { 
            font-size: 32px; 
            margin-bottom: 8px; 
        }
        .case-name { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }
        .case-price { 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 12px; 
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>✨ Loot Stars</h1>
    <div id="app"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const categories = [
            {
                title: "Обычные модули",
                cases: [
                    { name: "Базовый узел", price: 10, icon: "📦" },
                    { name: "Сектор 7", price: 25, icon: "📦" },
                    { name: "Медный реле", price: 50, icon: "⚙️" },
                    { name: "Системный блок", price: 100, icon: "🖥" },
                    { name: "Оранжевый поток", price: 250, icon: "🔥" },
                    { name: "Тяжелый архив", price: 500, icon: "🗄" },
                    { name: "Ядро Титана", price: 1000, icon: "☄️" },
                    { name: "Зенит", price: 2500, icon: "🌌" }
                ]
            },
            {
                title: "Фарм-кейсы",
                cases: [
                    { name: "Груда лома", price: 1, icon: "🔩" },
                    { name: "Техно-свалка", price: 5, icon: "🗑" },
                    { name: "Реакторный отсек", price: 10, icon: "☢️" }
                ]
            },
            {
                title: "Риск 50/50",
                cases: [
                    { name: "Бинарный код", price: 50, icon: "⚖️" },
                    { name: "Критический вольт", price: 200, icon: "⚡" },
                    { name: "Перегрузка", price: 500, icon: "💥" },
                    { name: "Сингулярность", price: 1000, icon: "🕳" }
                ]
            }
        ];

        const appDiv = document.getElementById('app');

        categories.forEach(category => {
            const title = document.createElement('h2');
            title.innerText = category.title;
            appDiv.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'grid-container';

            category.cases.forEach(c => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `
                    <div class="case-icon">${c.icon}</div>
                    <div class="case-name">${c.name}</div>
                    <div class="case-price">${c.price} Stars</div>
                    <button class="btn" onclick="openCase('${c.name}')">Купить</button>
                `;
                grid.appendChild(card);
            });

            appDiv.appendChild(grid);
        });

        function openCase(name) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showAlert('Вы открыли: ' + name);
        }
    </script>
</body>
</html>
